<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문의하기 | Rexolution</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<canvas id="ai-bg"></canvas>

<nav>
  <a class="logo" href="index.html" aria-label="Rexolution home">
    <img src="images/logo.png" alt="Rexolution logo">
    <img src="images/text.png" alt="Rexolution">
  </a>
  <div class="nav-links">
    <a class="nav-youtube" href="https://www.youtube.com/@Rexolution_KOR" target="_blank" rel="noopener noreferrer" aria-label="Rexolution YouTube">
      <img src="images/youtube.png" alt="">
    </a>
    <a href="about.html" data-i18n="nav.about">회사 소개</a>
    <a href="solution.html" data-i18n="nav.solution">솔루션</a>
    <a href="contact.html" class="active" aria-current="page" data-i18n="nav.contact">문의하기</a>
    <a href="map.html" data-i18n="nav.map">오시는 길</a>
    <div class="language-switcher">
      <button class="language-current" type="button" aria-label="Language selector">KR</button>
      <div class="language-menu">
        <button type="button" data-lang-option="ko">KR</button>
        <button type="button" data-lang-option="en">EN</button>
      </div>
    </div>
  </div>
</nav>

<main>
  <section class="page-hero">
    <div class="page-hero-inner">
      <p class="eyebrow">Let's Connect</p>
      <h1 data-i18n="contact.title">문의하기</h1>
    </div>
  </section>

    <section class="content">

    <div class="contact-grid">

        <!-- 문의하기 -->
        <article class="card no-hover">
        <p style="margin-bottom:10px; font-size: 20px;" data-i18n="contact.intro">
            제품 문의, 도입 상담 등 궁금하신 점을 자유롭게 남겨주세요.
        </p>

        <form id="contact-form" class="contact-form">

            <!-- 성 / 이름 -->
            <div class="form-row">
            <input type="text" name="last_name" placeholder="성" data-i18n-placeholder="contact.placeholder.lastName" required>
            <input type="text" name="first_name" placeholder="이름" data-i18n-placeholder="contact.placeholder.firstName" required>
            </div>

            <!-- 회사 -->
            <input type="text" name="company" placeholder="회사명" data-i18n-placeholder="contact.placeholder.company">

            <!-- 부서 / 직책 -->
            <div class="form-row">
            <input type="text" name="department" placeholder="부서" data-i18n-placeholder="contact.placeholder.department">
            <input type="text" name="position" placeholder="직책 / 직급" data-i18n-placeholder="contact.placeholder.position">
            </div>

            <!-- 이메일 -->
            <input type="email" name="user_email" placeholder="이메일" data-i18n-placeholder="contact.placeholder.email" required>

            <!-- 휴대전화 -->
            <input
              type="tel"
              name="phone"
              id="phone"
              inputmode="numeric"
              autocomplete="tel"
              maxlength="15"
              placeholder="국가번호 포함 숫자만 (예: 821012345678)"
              data-i18n-placeholder="contact.placeholder.phone">

            <!-- 문의 내용 -->
            <textarea name="message" placeholder="문의 내용을 입력해주세요" data-i18n-placeholder="contact.placeholder.message" required></textarea>

            <button type="submit" class="btn contact-submit" data-i18n="contact.submit">문의 보내기</button>

        </form>

        <p id="form-status" style="margin-top:10px; color:#888;"></p>

        </article>
    </div>

    </section>
</main>

<script src="bg.js"></script>
<script src="lang.js"></script>

<script>
const phoneInput = document.getElementById("phone");

if (phoneInput) {
  phoneInput.addEventListener("input", function(e) {
    e.target.value = e.target.value.replace(/\D/g, "").slice(0, 15);
  });
}

async function submitContactForm(form) {
  const status = document.getElementById("form-status");
  const submitButton = form.querySelector("button[type=\"submit\"]");
  status.innerText = window.getLangText ? window.getLangText("contact.status.sending", "전송 중...") : "전송 중...";
  submitButton.disabled = true;

  try {
    const formData = new FormData(form);
    const payload = Object.fromEntries(formData.entries());
    payload.language = document.documentElement.lang === "en" ? "en" : "ko";

    const response = await fetch("/api/contact", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (!response.ok) {
      throw new Error("Contact request failed");
    }

    form.reset();
    status.innerText = "";
    alert(window.getLangText ? window.getLangText("contact.alert.success", "문의가 정상적으로 전송되었습니다.") : "문의가 정상적으로 전송되었습니다.");
  } catch (err) {
    console.error(err);
    status.innerText = "";
    const retryMessage = window.getLangText
      ? window.getLangText(
          "contact.alert.fail.direct",
          "문의 전송에 실패했습니다.\n\n확인을 누르면 다시 시도합니다. 취소를 누르면 hkim@rexolution.ai로 직접 메일을 보낼 수 있습니다."
        )
      : "문의 전송에 실패했습니다.\n\n확인을 누르면 다시 시도합니다. 취소를 누르면 hkim@rexolution.ai로 직접 메일을 보낼 수 있습니다.";

    if (window.confirm(retryMessage)) {
      await submitContactForm(form);
      return;
    } else {
      const subject = document.documentElement.lang === "en" ? "Website inquiry" : "홈페이지 문의";
      window.location.href = `mailto:hkim@rexolution.ai?subject=${encodeURIComponent(subject)}`;
    }
  } finally {
    submitButton.disabled = false;
  }
}

document.getElementById("contact-form").addEventListener("submit", function(e) {
  e.preventDefault();
  submitContactForm(this);
});
</script>
<footer class="site-footer">
  <p data-i18n="footer.copyright">© 2026 (주)레졸루션 All rights reserved.</p>
  <p><a href="mailto:hkim@rexolution.ai">hkim@rexolution.ai</a></p>
  <p data-i18n="footer.address">서울특별시 서초구 매헌로 16 하이브랜드 AI양재허브 1201호</p>
</footer>
</body>
</html>
