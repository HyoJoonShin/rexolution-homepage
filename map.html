<main>
  <section class="page-hero">
    <div class="page-hero-inner">
      <p class="eyebrow">Visit Us</p>
      <h1 data-i18n="map.title">오시는 길</h1>
    </div>
  </section>

  <section class="content">
    <div class="contact-grid">
      <!-- 지도 + 정보 -->
      <article class="card">
        <div id="map-wrapper" style="position:relative;">
          <div id="map" style="width:100%; height:400px; border-radius:10px;"></div>
        </div>
        <div id="google-map-wrapper" style="display:none;">
          <iframe
            title="Rexolution location on Google Maps"
            src="https://www.google.com/maps?q=37.462506,127.036929&hl=en&z=16&output=embed"
            style="width:100%; height:400px; border:0; border-radius:10px;"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade">
          </iframe>
        </div>

        <script>
        let isDragging = false;
        let startX = 0;
        let startY = 0;

        const mapEl = document.getElementById('map-wrapper');

        mapEl.addEventListener('mousedown', function(e) {
          isDragging = false;
          startX = e.clientX;
          startY = e.clientY;
        });

        mapEl.addEventListener('mousemove', function(e) {
          const dx = Math.abs(e.clientX - startX);
          const dy = Math.abs(e.clientY - startY);

          if (dx > 5 || dy > 5) {
            isDragging = true;
          }
        });

        mapEl.addEventListener('mouseup', function() {
          if (!isDragging) {
            window.open(
              "https://map.kakao.com/?q=레졸루션",
              "_blank"
            );
          }
        });
        </script>

        <!-- 정보 -->
        <div style="margin-top:20px; line-height:1.6;">
          <p data-i18n-html="map.address"><strong>주소</strong>
           서울특별시 서초구 매헌로 16 하이브랜드 AI양재허브 1201호</p>

          <p data-i18n-html="map.phone"><strong>전화번호</strong>
           010-9048-1583</p>

          <p data-i18n-html="map.email"><strong>이메일</strong>
           hkim@rexolution.ai</p>
        </div>
      </article>
    </div>
  </section>
</main>

<script src="bg.js"></script>
<script src="lang.js"></script>
<script>
const kakaoMapWrapper = document.getElementById("map-wrapper");
const googleMapWrapper = document.getElementById("google-map-wrapper");

function setMapLanguage(lang) {
  const isEnglish = lang === "en";
  kakaoMapWrapper.style.display = isEnglish ? "none" : "block";
  googleMapWrapper.style.display = isEnglish ? "block" : "none";
}

window.addEventListener("rexolution:languagechange", (event) => {
  setMapLanguage(event.detail.lang);
});

window.initMap = function () {
  kakao.maps.load(function () {

    const container = document.getElementById('map');

    const options = {
      center: new kakao.maps.LatLng(37.462506,127.036929),
      level: 3
    };

    const map = new kakao.maps.Map(container, options);

    const marker = new kakao.maps.Marker({
      position: options.center
    });

    marker.setMap(map);

  });
};
</script>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=5ece0e2fc4eb3ea2672342b4882f16c1&autoload=false"
        onload="initMap()"></script>
